name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate locale JSON files
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "public/_locales";
            for (const locale of fs.readdirSync(dir)) {
              const file = path.join(dir, locale, "messages.json");
              if (fs.existsSync(file)) {
                JSON.parse(fs.readFileSync(file, "utf8"));
              }
            }
            console.log("All locale JSON files are valid.");
          '

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
